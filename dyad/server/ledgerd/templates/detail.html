<h2>record {{ value }}</h2>
{% for s in sections %}
<h3>{{ s.table }} <span class="meta">({{ s.key }} = {{ value }})</span></h3>
{% if not s.rows %}<p class="empty">none</p>{% endif %}
{% for r in s.rows %}
<dl>
  {% for c in s.columns %}<dt>{{ c }}</dt><dd>{{ "" if r[loop.index0] is none else r[loop.index0] }}</dd>{% endfor %}
</dl>
{% endfor %}
{% endfor %}
