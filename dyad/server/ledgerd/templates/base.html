<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgerd: {{ schema_name }}</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root { --ink: #1f2328; --muted: #656d76; --line: #d0d7de; --bg: #ffffff; --panel: #f6f8fa; --accent: #0969da; --warn: #9a6700; --bad: #cf222e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; }
  .sidebar h1 { font-size: 15px; margin: 0 0 8px; }
  .sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 4px; }
  .sidebar ul { list-style: none; margin: 0; padding: 0; }
  .sidebar li { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; }
  .sidebar li.active a { font-weight: 600; }
  .sidebar form.inline { display: inline; }
  .sidebar .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
  .main { padding: 12px 16px; min-width: 0; }
  details.mode { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; background: var(--panel); }
  details.mode > summary { cursor: pointer; padding: 6px 10px; font-weight: 600; }
  details.mode > div { padding: 8px 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .bar label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
  .bar select, .bar input, textarea, .save input { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; background: #fff; color: var(--ink); }
  .bar select[multiple] { min-width: 120px; height: 72px; }
  textarea { width: 100%; min-height: 96px; font-family: ui-monospace, monospace; }
  button { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.small { padding: 0 6px; font-size: 12px; }
  pre.sql { margin: 6px 0 0; padding: 6px 8px; background: #fff; border: 1px dashed var(--line); border-radius: 4px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  table.results { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.results th, table.results td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.results th { background: var(--panel); position: sticky; top: 0; white-space: nowrap; }
  table.results th a { color: var(--ink); }
  table.results tr.record { cursor: pointer; } table.results tr.record:hover { background: #fffbe6; }
  .footer { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 8px; flex-wrap: wrap; }
  .chooser { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; margin: 6px 0; }
  .error { color: var(--bad); white-space: pre-wrap; }
  .message { color: var(--warn); font-size: 12px; }
  .detail { border-top: 2px solid var(--line); margin-top: 14px; padding-top: 8px; }
  .detail h3 { margin: 10px 0 4px; font-size: 13px; }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0 0 8px; font-size: 12px; }
  .detail dt { color: var(--muted); } .detail dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
