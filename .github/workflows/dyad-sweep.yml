name: d-work sweep
# The automaton's sweep (d-work #564, #617; run-book `workstation-corpus/runbooks/automaton.md`, operate's, Rule-19).
# No clock since #617: it runs after each landed merge, once per landed cut, through the run-book's `sweep`
# (`dyad automaton sweep --row 564`, read-only):
#   - every guard over every store and the full suite, in GitHub's environment;
#   - the outside-repo drift checks: archives against BUNDLE.sha256 and their tags, moved tags, the mirror against main.
# The stall findings (heads not landed, corroboration, stale board, work in flight, backlog hygiene) are the home's
# read at each prompt, `dyad board resume` (#617), and the whole-store guards also run after each ledger push in the
# automaton's job (`sweep --stores`).
# Two starts: the automaton's job dispatches it when its run landed a merge (a push made with the workflow token
# starts no workflow, but `workflow_dispatch` does, #617 P1), and a push to main that changes code starts it, which
# covers a merge made outside the automaton (the home's app merge, a hand merge, P2); ledger-only and events-only
# pushes are left out by paths-ignore. A cut of several merges may start it more than once; the concurrency group
# queues them, and a second run tells nothing new (P3).
# It posts one notice to the home's inbox only for a finding that is new or failing. The core runner records the
# sweep's event, which this job commits events-only (clerical, Rule-3; no row, no PR) through the pre-push gate.
# A red sweep notifies; it holds nothing (plan #564, decision 2).
on:
  push:
    branches: [main]
    paths-ignore: ["agent-corpus/d-work/**", "workstation-corpus/runbooks/events/**"]   # ledger and events: no code
  workflow_dispatch: {}
permissions:
  contents: write   # the events-only commit and the inbox notice
  actions: read     # the corroboration check reads the workflow runs
concurrency: { group: dyad-sweep, cancel-in-progress: false }
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: sweep, through the automaton run-book, as the automaton's own read-only party (#593)
        env:
          DYAD_SESSION: automaton   # the inbox sender's seat
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
        run: |
          TZ=America/Los_Angeles printf 'sweep at %(%Y-%m-%d %H:%M %Z)T (%s)\n' -1 "${{ github.event_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath dyad/hooks   # every push through the gate a seat's push passes
          rc=0
          python3 dyad/scripts/package.py runbook run automaton sweep --as automaton || rc=$?
          ev=workstation-corpus/runbooks/events/automaton.jsonl
          if [ -n "$(git status --porcelain -- "$ev")" ]; then
            git add -- "$ev"
            git commit -qm "events: automaton sweep (d-work #564)"
            # main may have moved (the sweep's own inbox notice lands first): rebase the event and push, one retry
            { git pull -q --rebase origin main && git push -q origin HEAD:main; } ||
              { git pull -q --rebase origin main && git push -q origin HEAD:main; }
          fi
          exit $rc
