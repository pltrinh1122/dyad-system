name: rule-11 package
# Hosted corroboration on `main` (Rule-14 property 3; d-work #564 revision 2): every step this job used to run —
# `check`, Rule-1 containment over the push range and the tree, the Rule-3 fence over the range, the Rule-4 and
# Rule-6 guards (inside `check`), `build`, and a scratch install of the core and the sysadmin craft with its guards
# and an idempotent reinstall — is one command, `check --corroborate`, which the automaton's own job calls too, so the
# two cannot drift apart. The suite runs unless the landed code equals a head a done-`Y`'s evidence passed (E2).
# One run per push and only the newest kept (E3): a stack of merges is corroborated once, on the tree that stands.
# Events-only pushes (the sweep's heartbeat, read-only run-book observations) change no code and start no run (E5).
on:
  push:
    branches: [main]
    paths-ignore: ['agent-corpus/d-work/**', 'workstation-corpus/runbooks/events/**']
  workflow_dispatch:
concurrency: { group: main, cancel-in-progress: true }
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: corroborate (Rule-11 runner, Rule-1 containment, Rule-3 fence, build, scratch install)
        # the scratch's own python runs inside it; without this it writes bytecode into the scratch, `git add -A`
        # tracks it, and the scratch's `check` fails Rule-11 property 6 (#171)
        env: { PYTHONDONTWRITEBYTECODE: "1" }
        run: python3 dyad/scripts/package.py check --corroborate "${{ github.event.before }}" "${{ github.sha }}"
