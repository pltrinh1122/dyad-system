name: probe app
# d-work #609 step 1: a test timer to triangulate GitHub's schedule delivery. Read-only: no checkout, no commit, no
# inbox post. A run's delay is its created_at minus the nominal slot of the cron that fired it, read from the API
# (keyed by github.event.schedule). Its twin, dyad-probe-app.yml / dyad-probe-user.yml, is identical but for the name
# and is registered by the other actor (the Claude GitHub App's merge or the operator's own). Removed by #609 step 4.
on:
  schedule:
    - cron: '*/15 * * * *'   # T-15: frequent short slots
    - cron: '7 * * * *'      # T-07: hourly, early in the hour
    - cron: '37 * * * *'     # T-37: hourly, mid-hour
    - cron: '17 14,2 * * *'  # T-sweep: the sweep's own slots
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: print the cron that fired and the UTC time
        env:
          CRON: "${{ github.event.schedule }}"
        run: |
          TZ=UTC printf 'cron %s fired, now %(%Y-%m-%dT%H:%M:%SZ)T\n' "$CRON" -1
