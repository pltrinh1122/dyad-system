name: released
# The release service (d-work #461; run-book `workstation-corpus/runbooks/released.md`, Rule-19): the single release
# path. A request file on main names a tag the Operator ratified (`Y release <tag>` on the row it names, Rule-11
# Ratification events, Rule-2); this workflow is clerical execution of that Y, never a disposer. It checks the
# ratification and tag == VERSION at the cut sha, builds by the one code path (Rule-11 property 5), verifies the
# archive sha256 against the request, then creates the tag and the GitHub Release. Idempotent: an existing tag at the
# cut sha is reused, an existing Release is skipped, a tag that exists elsewhere is refused (tags never move). No tag-push
# trigger, so nothing double-fires (plan #461 attack 6). Each released request's event is attached to its Release
# (`<tag>.event.json`) and every request's is printed to the run log and summary; the run-book's health reconciles
# requests to tags and Releases.
on:
  push:
    branches: [main]
    paths: ["workstation-corpus/runbooks/releases/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "process only this request (its file is releases/<tag>.md); empty processes every request"
        required: false
        type: string
permissions:
  contents: write
concurrency: { group: released, cancel-in-progress: false }
jobs:
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional second gate (plan #461 attack 4): with the repository variable RELEASE_APPROVAL set to `tap` the job
    # runs in the `release` environment, whose required reviewer (the Operator) approves each run with one tap.
    # Unset or `ledger`: the recorded `Y release <tag>` alone gates, at merge trust. The preference is the cos's to propose.
    environment: ${{ vars.RELEASE_APPROVAL == 'tap' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, fetch-tags: true }   # the cut sha and existing tags are read from history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: process release requests
        env:
          GH_TOKEN: "${{ github.token }}"
          ONLY: "${{ inputs.tag }}"
          REQUESTS: workstation-corpus/runbooks/releases
          GATE: "${{ vars.RELEASE_APPROVAL || 'ledger' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/released.py
