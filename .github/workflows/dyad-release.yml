name: released
# The release service (d-work #461, plan revision 3; run-book `workstation-corpus/runbooks/released.md`, operate's,
# Rule-19): the single release path. The trigger is the ledger entry that records the Operator's release Y on the
# release's row, `<date> Y release <tag> at <cut sha> (archive <sha256>)` (Rule-11 Ratification events), written by the
# cos ledger-only; this workflow is clerical execution of that Y, never a disposer (Rule-2). `.github/released.py` reads
# every such entry, checks the cut sha is on main and tag == VERSION at it, builds by the one code path (Rule-11 property
# 5), verifies the sha256, then creates the annotated tag and the GitHub Release. Idempotent: a tag at the cut sha with
# its Release is skipped, a tag elsewhere is refused (tags never move). No tag-push trigger, so nothing double-fires
# (plan #461 attack 6). Its record is `<runbooks>/events/released.jsonl`, committed to main as an events-only commit.
on:
  push:
    branches: [main]
    paths: ["agent-corpus/d-work/rows/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "process only this tag's release entry (retries a refused one); empty processes every entry"
        required: false
        type: string
permissions:
  contents: write
concurrency: { group: released, cancel-in-progress: false }
jobs:
  scan:
    # read-only: is there a release entry with work to do? So the gate below is asked only when something publishes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { pending: "${{ steps.scan.outputs.pending }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: scan
        env: { GH_TOKEN: "${{ github.token }}", ONLY: "${{ inputs.tag }}" }
        run: python3 .github/released.py --scan
  released:
    needs: scan
    if: needs.scan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional second gate (plan #461 attack 4): with the repository variable RELEASE_APPROVAL set to `tap` this job runs
    # in the `release` environment, whose required reviewer (the Operator) approves each publishing run with one tap.
    # Unset or `ledger`: the recorded `Y release` alone gates, at merge trust. The preference is the cos's to propose.
    environment: ${{ vars.RELEASE_APPROVAL == 'tap' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, fetch-tags: true }   # the cut sha and existing tags are read from history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: publish recorded release entries
        env:
          GH_TOKEN: "${{ github.token }}"
          ONLY: "${{ inputs.tag }}"
          GATE: "${{ vars.RELEASE_APPROVAL || 'ledger' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/released.py
      - name: commit the events (events-only, Rule-3 Ledger)
        if: always()
        run: |
          f=workstation-corpus/runbooks/events/released.jsonl
          git diff --quiet -- "$f" && [ -z "$(git ls-files --others -- "$f")" ] && { echo "no new event"; exit 0; }
          git add -- "$f"
          git commit -q -m "events: released, run ${GITHUB_RUN_ID} (#461)"
          for i in 1 2 3 4; do git push origin HEAD:main && exit 0; git pull -q --rebase origin main; done   # a concurrent push to main: rebase the one events commit, retry
          exit 1
